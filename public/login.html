<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Library</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .demo-accounts {
            background: var(--bg-tertiary);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 2rem;
            border: 1px solid var(--border);
        }

        .demo-accounts h3 {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .demo-account {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .demo-account:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .demo-account:last-child {
            margin-bottom: 0;
        }

        .demo-account .role {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background: var(--accent-light);
            color: var(--accent);
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .demo-account .role.admin {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .demo-account .credentials {
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>📚 Digital Library</h1>
                <p>Login to manage your book collection</p>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password" autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    🔐 Login
                </button>
            </form>

            <div class="demo-accounts">
                <h3>Demo Accounts (Click to Auto-fill)</h3>
                
                <div class="demo-account" onclick="fillLogin('user', 'user123')">
                    <div class="role">👤 User</div>
                    <div class="credentials">
                        <div>Username: <strong>user</strong></div>
                        <div>Password: <strong>user123</strong></div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">
                        ✓ Add books &nbsp; ✓ View books &nbsp; ✓ Upload images
                    </div>
                </div>

                <div class="demo-account" onclick="fillLogin('admin', 'admin123')">
                    <div class="role admin">👑 Admin</div>
                    <div class="credentials">
                        <div>Username: <strong>admin</strong></div>
                        <div>Password: <strong>admin123</strong></div>
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">
                        ✓ Full access &nbsp; ✓ Edit books &nbsp; ✓ Delete books
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillLogin(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Validasi credentials
            const accounts = {
                'user': { password: 'user123', role: 'user', token: 'token-user-123', name: 'Regular User' },
                'admin': { password: 'admin123', role: 'admin', token: 'token-admin-456', name: 'Administrator' }
            };

            const account = accounts[username];

            if (!account || account.password !== password) {
                showError('❌ Invalid username or password');
                return;
            }

            // Simpan session ke localStorage
            localStorage.setItem('auth', JSON.stringify({
                username: username,
                role: account.role,
                token: account.token,
                name: account.name,
                loginTime: new Date().toISOString()
            }));

            // Redirect ke dashboard
            window.location.href = 'dashboard.html';
        }

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const auth = localStorage.getItem('auth');
            if (auth) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
